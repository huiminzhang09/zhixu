<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Orchestra</title><link rel="stylesheet" href="./auth.css?v=20261014-enterprise-onboarding"></head>
<body><main class="auth-card"><a class="brand" href="./login.html"><img src="./assets/orchestra-logo.png" alt="" width="36" height="36"><span>orchestra</span></a><h1>登录</h1><p class="intro">让灵感成为作品</p><form data-mode="login"><label for="account">手机号</label><input id="account" name="account" type="tel" inputmode="numeric" autocomplete="username" placeholder="请输入手机号" required pattern="1[3-9][0-9]{9}" maxlength="11"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required minlength="8" maxlength="64"><p class="hint">密码长度为八至六十四位。</p><p class="message" id="message" role="status" aria-live="polite"></p><button class="primary" type="submit">登录</button></form><nav class="auth-links" aria-label="账号操作"><span>还没有账号？ <a href="./register.html">注册</a></span><a href="./reset-password.html">修改密码</a></nav><p class="demo-note">交互演示：未接入账号服务，不保存密码。请使用示例信息体验。</p><div class="demo-accounts"><p><b>18500760312</b>：该账号初始无企业，在企业选择页新建企业后进入系统。</p><p><b>18500760311</b>：该账号需要选择企业登录。</p><p>演示密码：任意八至六十四位非纯空格字符。</p></div></main><script src="./auth.js?v=20261014-enterprise-onboarding"></script></body></html>
