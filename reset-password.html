<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改密码 · Orchestra</title><link rel="stylesheet" href="./auth.css?v=20261021-skip-organization"></head>
<body><main class="auth-card"><a class="brand" href="./login.html"><img src="./assets/orchestra-logo.png" alt="" width="36" height="36"><span>orchestra</span></a><h1>修改密码</h1><p class="intro">让灵感成为作品</p><form data-mode="reset-password"><label for="account">手机号</label><input id="account" name="account" type="tel" inputmode="numeric" autocomplete="username" placeholder="请输入手机号" required pattern="1[3-9][0-9]{9}" maxlength="11"><label for="code">验证码</label><div class="code-row"><input id="code" name="code" autocomplete="one-time-code" inputmode="numeric" placeholder="请输入六位验证码" required pattern="[0-9]{6}" maxlength="6"><button id="sendCode" class="secondary" type="button">发送验证码</button></div><p id="codeHint" class="hint" role="status"></p><label for="password">新密码</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="请输入新密码" required minlength="6" maxlength="18"><label for="confirm">再次输入密码</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="请输入再次输入密码" required minlength="6" maxlength="18"><p class="hint">密码长度为 6～18 位。</p><p class="message" id="message" role="status" aria-live="polite"></p><button class="primary" type="submit">确认修改</button></form><nav class="auth-links" aria-label="账号操作"><a href="./login.html">返回登录</a></nav><p class="demo-note">交互演示：未接入账号服务，不保存密码。请使用示例信息体验。</p></main><script src="./account-phone.js?v=20261026-account-security"></script><script src="./auth.js?v=20261026-account-security"></script></body></html>
